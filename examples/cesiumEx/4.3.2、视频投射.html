<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./../../libs/cesium/Cesium1.98/Widgets/widgets.css">
    <script type="text/javascript" src="./../../libs/cesium/Cesium1.98/Cesium.js"></script>
    <script src="./video.js"></script>
    <script src="./turf.min.js"></script>
    <script src="./hls.js"></script>
    <script src="./lodash.min.js"></script>
    <style>
        #menu {
            position: absolute;
            top: 20px;
            left: 0;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            z-index: 9999;
        }

        #video_dom {
            display: none;
            position: absolute;
            transform: rotate(180deg);
            -webkit-transform: rotate(180deg);
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
    <div id="menu">
    </div>
    <video id="video_dom" preload="auto" autoPlay loop>
    </video>
    <!-- ./video.mp4 -->
    <script type="text/javascript">

        const viewer = new Cesium.Viewer('map', {
            imageryProvider: false,
            baseLayerPicker: false,
            contextOptions: {
                requestWebgl1: true,
            },
        });
     // 加载xyz
        var xyz = new Cesium.UrlTemplateImageryProvider({
            "credit": "mapbox",
            "url": '法律法规'
        })
        viewer.imageryLayers.addImageryProvider(xyz)
        viewer.scene.debugShowFramesPerSecond = true;
        viewer.scene.globe.depthTestAgainstTerrain = true;
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(112.681287, 33.248737, 1300),
            orientation: {
                heading: Cesium.Math.toRadians(269.4), // 方向
                pitch: Cesium.Math.toRadians(-29.0), // 俯仰角
                roll: Cesium.Math.toRadians(0.0) // 翻滚角
            }

        });
        var videoSrc = 'https://kbs-dokdo.gscdn.com/dokdo_300/definst/dokdo_300.stream/playlist.m3u8';
        var options = {
            horizontalViewAngle: 60,
            verticalViewAngle: 40,
            video: "video_dom",
            viewPosition: Cesium.Cartesian3.fromDegrees(112.66669, 33.248659, 1220),
            viewPositionEnd: Cesium.Cartesian3.fromDegrees(112.66669, 33.247659, 30),
        };
        v = new video(viewer, options);
        v.drawVideo();

        // 播放
        video_dom.play();
        switchSP();

        // 暂停
        // video_dom.pause();

        // 清除
        // new video(viewer, {}).clearAll();

        // 视角宽高比例
        // v.change({
        //     aspectRatio: 1.7
        // })
        // // 视角水平张角
        // v.change({
        //     fov: 1.2
        // })
        // // 视角距离
        // v.change({
        //     far: 200
        // })

        // 切换视频源
        function switchSP() {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video_dom);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video_dom.play();  // 当解析完毕后开始播放
            });
        }

    </script>
</body>

</html>
