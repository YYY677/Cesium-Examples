<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./../../libs/cesium/Cesium1.98/Widgets/widgets.css">
    <script type="text/javascript" src="./../../libs/cesium/Cesium1.98/Cesium.js"></script>
    <script src="./turf.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
    <script type="text/javascript">

                const viewer = new Cesium.Viewer('map', {
            imageryProvider: false,
            baseLayerPicker: false,
        });

        var xyz = new Cesium.UrlTemplateImageryProvider({
            "url": 'https://t0.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=c1e7bf15c41cc47dc8889ebe2399ced4'
        })
        viewer.imageryLayers.addImageryProvider(xyz)

        // 开启帧率
        viewer.scene.debugShowFramesPerSecond = true;

        var points = turf.randomPoint(1000, { bbox: [-180, -90, 180, 90] })

        points.features.forEach((k) => {
            let cor = k.geometry.coordinates;

            var origin = Cesium.Cartesian3.fromDegrees(cor[0], cor[1], 20000.0);
            var modelMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(origin);

            viewer.scene.primitives.add(Cesium.Model.fromGltf({
                scale: 500000,
                modelMatrix: modelMatrix,
                url: './Man.glb',
            }));
        })

    </script>
</body>

</html>
