<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./../../libs/cesium/Cesium1.98/Widgets/widgets.css">
    <script type="text/javascript" src="./../../libs/cesium/Cesium1.98/Cesium.js"></script>

</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
    <script type="text/javascript">

        const viewer = new Cesium.Viewer('map', {
            imageryProvider: false,
            baseLayerPicker: false,
        });

        var xyz = new Cesium.UrlTemplateImageryProvider({
            "url": 'https://t0.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=c1e7bf15c41cc47dc8889ebe2399ced4'
        })
        viewer.imageryLayers.addImageryProvider(xyz)

        // 开启帧率
        viewer.scene.debugShowFramesPerSecond = true;

        // 取消默认的单击和双击事件，右上角弹窗很丑
        viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_CLICK);
        viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);


        var position = Cesium.Cartesian3.fromDegrees(121.507762, 31.233975, 200);
        var heading = Cesium.Math.toRadians(215);
        var pitch = Cesium.Math.toRadians(0);
        var roll = Cesium.Math.toRadians(0);

        var hpr = new Cesium.HeadingPitchRoll(heading, pitch, roll);
        var orientation = Cesium.Transforms.headingPitchRollQuaternion(
            position,
            hpr
        );

        var entity = viewer.entities.add({
            position: position,
            orientation: orientation,
            model: {
                uri: 'https://data.mars3d.cn/gltf/mars/shanghai/pudong/scene.gltf',
                scale: 520,
            }
        });

        viewer.flyTo(entity)

    </script>
</body>

</html>
